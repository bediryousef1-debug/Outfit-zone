name: SEO build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/seo-crawler-resilience]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript lint
        run: npm run lint
      - name: Production build
        run: npm run build
