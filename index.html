<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Outfit Zone | Wear In The Zone - براند ستريت وير مصري</title>
    <meta name="description" content="Outfit Zone - براند ملابس ستريت وير رجالي في مصر. تيشيرتات Box Fit و Oversized، بولو وقمصان بتصميم عصري وخامات قطنية ثقيلة. الدفع عند الاستلام مع إمكانية المعاينة قبل الاستلام." />
    <meta property="og:title" content="Outfit Zone | Wear In The Zone - براند ستريت وير مصري" />
    <meta property="og:description" content="تيشيرتات وبولو ستريت وير Box Fit و Oversized بأعلى خامات قطن مصري والدفع عند الاستلام." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://outfitzone-eg.vercel.app/" />
    <link rel="canonical" href="https://outfitzone-eg.vercel.app/" />
    <meta property="og:locale" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('oz_theme');
          var isDark = true; // default dark fallback
          if (saved === 'dark' || saved === 'light') {
            isDark = (saved === 'dark');
          } else if (window.matchMedia) {
            if (window.matchMedia('(prefers-color-scheme: light)').matches) {
              isDark = false;
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            } else {
              isDark = true;
            }
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }

          var savedLang = localStorage.getItem('oz_lang');
          if (savedLang === 'en') {
            root.dir = 'ltr';
            root.lang = 'en';
          } else {
            root.dir = 'rtl';
            root.lang = 'ar';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen transition-colors duration-200 bg-[#f9f9fb] text-[#09090b] dark:bg-[#0c0c0e] dark:text-[#ededed] selection:bg-neutral-200 selection:text-black dark:selection:bg-neutral-800 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
