    <script>
      (function() {
        try {
          var saved = localStorage.getItem('oz_theme');
          var isDark = true; // default dark fallback
          if (saved === 'dark' || saved === 'light') {
            isDark = (saved === 'dark');
          } else if (window.matchMedia) {
            if (window.matchMedia('(prefers-color-scheme: light)').matches) {
              isDark = false;
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            } else {
              isDark = true;
            }
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }

          var savedLang = localStorage.getItem('oz_lang');
          if (savedLang === 'en') {
            root.dir = 'ltr';
            root.lang = 'en';
          } else {
            root.dir = 'rtl';
            root.lang = 'ar';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var path = window.location.pathname;
        if (path.length > 1 && path.charAt(path.length - 1) === '/') path = path.slice(0, -1);
        path = path || '/';
        var privateRoute = path === '/cart' || path === '/checkout' ||
          path === '/track' || path.indexOf('/order-success/') === 0 ||
          path === '/admin' || path.indexOf('/admin/') === 0;
        var titles = {
          '/': ['Outfit Zone | Wear In The Zone - براند ستريت وير مصري', 'Outfit Zone - براند ملابس ستريت وير رجالي في مصر. تيشيرتات Box Fit و Oversized مع الدفع عند الاستلام.'],

          '/about': ['قصتنا وعن البراند | Outfit Zone', 'تعرف على قصة Outfit Zone ورؤيتنا في تقديم ملابس ستريت وير رجالي بتصاميم عصرية.'],
          '/contact': ['تواصل معنا | Outfit Zone', 'تواصل مع Outfit Zone للاستفسار عن المنتجات والمقاسات والطلبات.']
        };
        var englishTitles = {
          '/': ['Outfit Zone | Wear In The Zone - Egyptian Streetwear Brand', 'Outfit Zone is an Egyptian men’s streetwear brand. Explore Box Fit and Oversized T-shirts, polos and shirts with cash on delivery.'],
          '/products': ['Streetwear Collection | Outfit Zone', 'Browse the Outfit Zone men’s streetwear collection and discover available styles.'],
          '/about': ['About the Brand | Outfit Zone', 'Learn about Outfit Zone and our approach to modern men’s streetwear.'],
          '/contact': ['Contact Us | Outfit Zone', 'Contact Outfit Zone about products, sizing and orders.']
        };
        var title = document.documentElement.lang === 'en' ? englishTitles[path] : titles[path];
        if (privateRoute) {
          document.querySelector('link[rel="canonical"]')?.remove();
          var robots = document.querySelector('meta[name="robots"]');
          if (!robots) {
            robots = document.createElement('meta');
            robots.name = 'robots';
            document.head.appendChild(robots);
          }
          robots.content = 'noindex, nofollow';
          return;
        }
        if (path.indexOf('/products/') === 0) return;
        var canonicalUrl = 'https://outfitzone-eg.vercel.app' + (path === '/' ? '/' : path);
        var canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement('link');
          canonical.rel = 'canonical';
          document.head.appendChild(canonical);
        }
        canonical.href = canonicalUrl;
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.content = canonicalUrl;
        if (title) {
          document.title = title[0];
          var description = document.querySelector('meta[name="description"]');
          if (description) description.content = title[1];
          var ogTitle = document.querySelector('meta[property="og:title"]');
          if (ogTitle) ogTitle.content = title[0];
          var ogDescription = document.querySelector('meta[property="og:description"]');
          if (ogDescription) ogDescription.content = title[1];
        }
      })();
    </script>
